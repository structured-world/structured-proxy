# cargo-audit configuration.
# Run: cargo audit
#
# Ignored deliberately; mirror of deny.toml, which carries the full rationale.
#
# RUSTSEC-2023-0071: "Marvin Attack" timing sidechannel in `rsa`, via the
# RustCrypto JWT and TLS providers of sid-crypto. No fixed `rsa` release exists;
# RSA only verifies signatures with public keys (JWTs, TLS server certificates),
# both providers refuse RSA private keys, and Marvin targets private-key timing.
# See https://github.com/structured-world/structured-proxy/issues/48
[advisories]
ignore = ["RUSTSEC-2023-0071"]
