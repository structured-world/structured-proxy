# cargo-audit configuration.
# Run: cargo audit
#
# Ignored deliberately; mirror of deny.toml, which carries the full rationale.
#
# RUSTSEC-2023-0071: "Marvin Attack" timing sidechannel in `rsa` 0.9.x, via
# jsonwebtoken's rust_crypto backend and the RustCrypto rustls provider.
# No fixed `rsa` release exists; RSA only verifies signatures with public keys
# (JWTs, TLS server certificates), and Marvin targets private-key timing.
# See https://github.com/structured-world/structured-proxy/issues/48
#
# RUSTSEC-2026-0049 / -0098 / -0099 / -0104: `rustls-webpki` 0.102 via
# rustls-rustcrypto 0.0.2-alpha, which only reads its `alg_id` constants;
# certificates are verified by rustls' own, patched rustls-webpki 0.103.
# RUSTSEC-2024-0436: `paste` (unmaintained build-time proc-macro) via the same
# crate. Remove all five with the next rustls-rustcrypto release.
# See https://github.com/structured-world/structured-proxy/issues/98
[advisories]
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0049",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  "RUSTSEC-2024-0436",
]
