# cargo-audit configuration.
# Run: cargo audit
#
# Ignored deliberately; mirror of deny.toml, which carries the full rationale.
#
# RUSTSEC-2023-0071: "Marvin Attack" timing sidechannel in `rsa`, via the
# sid-crypto RustCrypto JWT and rustls providers.
# No fixed `rsa` release exists; RSA only verifies signatures with public keys
# (JWTs, TLS peer certificates), RSA private-key operations are refused, and
# Marvin targets private-key timing.
# See https://github.com/structured-world/structured-proxy/issues/48
[advisories]
ignore = [
  "RUSTSEC-2023-0071",
]
